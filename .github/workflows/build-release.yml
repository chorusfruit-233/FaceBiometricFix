name: Build & Release

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Ensure Android SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Read version and detect version change
        id: version
        shell: bash
        run: |
          set -euo pipefail

          version_code=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts)
          version_name=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ -z "$version_code" || -z "$version_name" ]]; then
            echo "Unable to read versionCode/versionName" >&2
            exit 1
          fi

          release_tag="v${version_name}"
          apk_version="${version_code}-${version_name}"
          version_changed=true
          if [[ "$GITHUB_EVENT_NAME" == "push" && -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            old_version_code=$(git show "${{ github.event.before }}:app/build.gradle.kts" 2>/dev/null | sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' || true)
            old_version_name=$(git show "${{ github.event.before }}:app/build.gradle.kts" 2>/dev/null | sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' || true)
            [[ "$version_code-$version_name" != "$old_version_code-$old_version_name" ]] || version_changed=false
          fi

          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "apk_version=$apk_version" >> "$GITHUB_OUTPUT"
          echo "version_changed=$version_changed" >> "$GITHUB_OUTPUT"
          echo "Release tag: $release_tag (APK: $apk_version); version changed: $version_changed"

      - name: Stop when software version did not change
        if: steps.version.outputs.version_changed != 'true'
        run: echo "No version change; release skipped."

      - name: Restore signing configuration
        if: steps.version.outputs.version_changed == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?ANDROID_KEYSTORE_BASE64 is not configured}"
          : "${KEYSTORE_PASSWORD:?ANDROID_KEYSTORE_PASSWORD is not configured}"
          : "${KEY_ALIAS:?ANDROID_KEY_ALIAS is not configured}"
          : "${KEY_PASSWORD:?ANDROID_KEY_PASSWORD is not configured}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          cat > signing.properties <<EOF
          storeFile=$RUNNER_TEMP/release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Test, lint and build release APK
        if: steps.version.outputs.version_changed == 'true'
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace

      - name: Prepare signed APK
        if: steps.version.outputs.version_changed == 'true'
        run: |
          set -euo pipefail
          apk_name="FaceBiometricFix-${{ steps.version.outputs.apk_version }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk_name"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk_name"
          sha256sum "$apk_name" > "$apk_name.sha256"
          echo "APK_NAME=$apk_name" >> "$GITHUB_ENV"

      - name: Create release in main repository
        if: steps.version.outputs.version_changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          release_tag="${{ steps.version.outputs.release_tag }}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $release_tag already exists in $GITHUB_REPOSITORY; refusing to replace it" >&2
            exit 1
          fi
          gh release create "$release_tag" "$APK_NAME" "$APK_NAME.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$release_tag" \
            --notes-file CHANGELOG.md
